<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="900" height="400" fill="#ffffff"/>
  <style>
    .title{font:700 22px Arial,sans-serif;fill:#172033}.sub{font:14px Arial,sans-serif;fill:#5a6475}.label{font:13px Arial,sans-serif;fill:#394457}.tick{font:11px Arial,sans-serif;fill:#6a7484}.axis{stroke:#d7dce5;stroke-width:1}.grid{stroke:#eef1f5;stroke-width:1}.line{fill:none;stroke:#4f6bed;stroke-width:4}.point{fill:#4f6bed}.value{font:700 13px Arial,sans-serif;fill:#172033}
  </style>
  <text x="450" y="31" text-anchor="middle" class="title">Naive forecast error rises with horizon</text>
  <text x="450" y="53" text-anchor="middle" class="sub">Mean absolute percentage error across 518 annual tourism series</text>
  <line x1="95" y1="315" x2="835" y2="315" class="axis"/>
  <line x1="95" y1="90" x2="95" y2="315" class="axis"/>
  <line x1="95" y1="240" x2="835" y2="240" class="grid"/><text x="80" y="244" text-anchor="end" class="tick">10%</text>
  <line x1="95" y1="165" x2="835" y2="165" class="grid"/><text x="80" y="169" text-anchor="end" class="tick">20%</text>
  <line x1="95" y1="90" x2="835" y2="90" class="grid"/><text x="80" y="94" text-anchor="end" class="tick">30%</text>
  <text x="38" y="205" transform="rotate(-90 38 205)" text-anchor="middle" class="label">MAPE</text>
  <polyline points="180,219.4 380,168.0 580,146.6 780,100.0" class="line"/>
  <circle cx="180" cy="219.4" r="7" class="point"/><circle cx="380" cy="168" r="7" class="point"/><circle cx="580" cy="146.6" r="7" class="point"/><circle cx="780" cy="100" r="7" class="point"/>
  <text x="180" y="202" text-anchor="middle" class="value">12.75%</text><text x="380" y="151" text-anchor="middle" class="value">19.60%</text><text x="580" y="129" text-anchor="middle" class="value">22.46%</text><text x="780" y="83" text-anchor="middle" class="value">28.66%</text>
  <text x="180" y="340" text-anchor="middle" class="label">1 year</text><text x="380" y="340" text-anchor="middle" class="label">2 years</text><text x="580" y="340" text-anchor="middle" class="label">3 years</text><text x="780" y="340" text-anchor="middle" class="label">4 years</text>
  <text x="450" y="375" text-anchor="middle" class="sub">A flat last-value forecast becomes progressively less reliable as the projection horizon extends.</text>
</svg>